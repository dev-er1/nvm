name: Release CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-release:
    name: Publish for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ========== Linux ==========
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: nvm
            archive_name: nvm-linux-x64.tar.gz
            package_format: tar.gz
          
          - os: ubuntu-latest
            target: x86-unknown-linux-gnu
            binary_name: nvm
            archive_name: nvm-linux-x86.tar.gz
            package_format: tar.gz

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: nvm
            archive_name: nvm-linux-aarch64.tar.gz
            package_format: tar.gz
        
        # ========== Windows ==========
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: nvm.exe
            archive_name: nvm-windows-x64.zip
            package_format: zip

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary_name: nvm.exe
            archive_name: nvm-windows-aarch64.zip
            package_format: zip

        # ========== macOS ==========
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: nvm
            archive_name: nvm-macos-x64.tar.gz
            package_format: tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: nvm
            archive_name: nvm-macos-aarch64.tar.gz
            package_format: tar.gz

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Enable Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build nvm-cli
        run: cargo build --release --package nvm-cli --target ${{ matrix.target }}

      - name: Package Windows asset
        if: matrix.package_format == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/nvm.exe"
          Compress-Archive -Path "dist/nvm.exe" -DestinationPath "${{ matrix.archive_name }}" -Force

      - name: Package Unix asset
        if: matrix.package_format == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/nvm"
          tar -czf "${{ matrix.archive_name }}" -C dist nvm

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}